# SPDX-License-Identifier: MPL-2.0
name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required so tag builds can publish a Release
    steps:
      - uses: actions/checkout@v4

      # libcosmic / iced need a newer Rust than the Ubuntu archive ships, so we
      # build with the rustup stable toolchain rather than apt's cargo/rustc.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot pkg-config \
            libdrm-dev libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libexpat1-dev

      - name: Build the .deb
        run: |
          # -d skips the apt cargo/rustc build-dep check; debian/rules calls the
          # rustup `cargo` installed above (first on PATH). The package is
          # produced in the parent directory, so collect it into dist/.
          dpkg-buildpackage -b -us -uc -d
          mkdir -p dist
          mv ../cosmic-nightlight_*.deb dist/
          ls -l dist/

      - name: Upload .deb as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-nightlight-deb
          path: dist/*.deb
          if-no-files-found: error

      # Only on a pushed tag like v0.1.0: attach the .deb to a GitHub Release.
      - name: Build the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Check the tag against every place the version is written before
          # publishing anything, so a forgotten bump fails the release instead of
          # shipping notes for the previous one — or, in the metainfo's case,
          # showing the previous version on the Store page indefinitely.
          if ! scripts/check-version.sh "$GITHUB_REF_NAME"; then
            echo "::error::version mismatch; see the output above"
            exit 1
          fi

          # Prefer notes written for this release: they are what a reader wants,
          # grouped and with the install steps, rather than the changelog's flat
          # list. Fall back to the changelog so a forgotten file still ships
          # something accurate, and let GitHub append its generated PR list in
          # that case only — a hand-written file already ends with the compare
          # link, and the published releases before this one carry no such
          # section.
          handwritten="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$handwritten" ]; then
            cp "$handwritten" release-notes.md
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no $handwritten; falling back to debian/changelog"
            scripts/release-notes.sh > release-notes.md
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          # Match the titles of the earlier releases, e.g. "v0.4.0 — Night Light".
          name: ${{ github.ref_name }} — Night Light
          # Without a body the notes would be GitHub's generated section alone —
          # a list of merged PRs, which says nothing about a release pushed
          # straight to main.
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate }}
