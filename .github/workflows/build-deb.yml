# SPDX-License-Identifier: MPL-2.0
name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required so tag builds can publish a Release
    steps:
      - uses: actions/checkout@v4

      # libcosmic / iced need a newer Rust than the Ubuntu archive ships, so we
      # build with the rustup stable toolchain rather than apt's cargo/rustc.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot pkg-config \
            libdrm-dev libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libexpat1-dev

      - name: Build the .deb
        run: |
          # -d skips the apt cargo/rustc build-dep check; debian/rules calls the
          # rustup `cargo` installed above (first on PATH). The package is
          # produced in the parent directory, so collect it into dist/.
          dpkg-buildpackage -b -us -uc -d
          mkdir -p dist
          mv ../cosmic-nightlight_*.deb dist/
          ls -l dist/

      - name: Upload .deb as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-nightlight-deb
          path: dist/*.deb
          if-no-files-found: error

      # Only on a pushed tag like v0.1.0: attach the .deb to a GitHub Release.
      - name: Build the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Check the tag against the changelog before publishing anything, so a
          # forgotten version bump fails the release instead of shipping notes
          # for the previous one.
          changelog_version="$(dpkg-parsechangelog -l debian/changelog -S Version)"
          changelog_version="${changelog_version%-*}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$changelog_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog ($changelog_version)"
            exit 1
          fi
          scripts/release-notes.sh > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          # The changelog entry for this release, which GitHub's generated
          # "What's Changed" section is appended to. Without a body the notes
          # would be that generated section alone — a list of merged PRs, which
          # says nothing about a release pushed straight to main.
          body_path: release-notes.md
          generate_release_notes: true
