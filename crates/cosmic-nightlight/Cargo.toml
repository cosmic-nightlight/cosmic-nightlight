# SPDX-License-Identifier: MPL-2.0
[package]
name = "cosmic-nightlight"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cosmic-nightlight"
path = "src/main.rs"

[dependencies]
nightlight-core.workspace = true
chrono.workspace = true
# For `flock`, which serializes gamma applies across our processes.
libc.workspace = true

# Localization. All three are already in the tree underneath libcosmic, which
# localizes itself the same way, so declaring them here pulls in no new crates
# and leaves `Cargo.lock` alone — what it adds to the binary is the catalogs.
#
# `fluent-system` is the message format; `desktop-requester` is what reads
# `LANG`/`LC_MESSAGES` to find out which language to ask for.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
# The `fl!` proc macro, which resolves message ids against `i18n.toml`'s
# fallback catalog at compile time.
i18n-embed-fl = "0.10"
# `debug-embed` makes debug builds carry the catalogs the way release builds do.
# Without it rust-embed reads them off disk relative to the crate directory, so
# a debug binary run from anywhere else comes up with no translations — a
# confusing way to lose an afternoon.
rust-embed = { version = "8", features = ["debug-embed"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Unpinned, so `Cargo.lock` is what decides. Frosted glass needs a libcosmic that
# knows about the theme's `frosted_*` flags and drives `ext-background-effect-v1`
# off them — anything from before that (roughly mid-June 2026) leaves every
# surface flatly opaque while the rest of the desktop blurs, with nothing in this
# crate to say why. Don't roll the lock file back past it.
#
# `applet` adds panel-applet support (status-bar icon + popup). We intentionally
# omit `wgpu` so every surface renders with the tiny-skia software renderer —
# the GPU renderer re-inits per layer-shell surface, which made the panel icon
# take 30–60s to appear and the popup ~5s to open (and falls back to slow
# software Vulkan when the applet can't reach the GPU). tiny-skia is always
# compiled in by libcosmic, so this just drops the GPU stack from the binary.
features = ["applet"]
